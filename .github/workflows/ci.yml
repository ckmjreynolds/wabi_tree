  name: CI

  on:
    push:
      branches: [main]
      tags: ['v*']
    pull_request:
      branches: [main]

  # Least privilege for GITHUB_TOKEN; jobs that need more (audit) widen it themselves.
  # Publishing and Codecov use their own tokens.
  permissions:
    contents: read

  env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -Dwarnings

  jobs:
    # Format check
    fmt:
      name: Rustfmt
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt
        - run: cargo fmt --all --check

    # Lint check
    clippy:
      name: Clippy
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: dtolnay/rust-toolchain@stable
          with:
            components: clippy
        - uses: Swatinem/rust-cache@v2
        - run: cargo clippy --all-targets --all-features

    # Documentation
    docs:
      name: Docs
      runs-on: ubuntu-latest
      env:
        RUSTDOCFLAGS: -Dwarnings
      steps:
        - uses: actions/checkout@v7
        - uses: dtolnay/rust-toolchain@stable
        - uses: Swatinem/rust-cache@v2
        - run: cargo doc --no-deps --all-features

    # Test matrix across platforms and Rust versions
    test:
      name: Test (${{ matrix.os }}, ${{ matrix.rust }})
      runs-on: ${{ matrix.os }}
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]
          rust: [stable, beta]
          include:
            # MSRV check on Linux only
            - os: ubuntu-latest
              rust: "1.88"
      steps:
        - uses: actions/checkout@v7
        - uses: dtolnay/rust-toolchain@master
          with:
            toolchain: ${{ matrix.rust }}
        - uses: Swatinem/rust-cache@v2
        - run: cargo build --all-features
        - run: cargo test --all-features
        # Release builds drop debug assertions, so run the suite there too (Linux stable only).
        - if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
          run: cargo test --all-features --release

    # Code coverage (Linux only, nightly for branch coverage)
    coverage:
      name: Coverage
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: dtolnay/rust-toolchain@master
          with:
            toolchain: nightly-2026-10-17
            components: llvm-tools-preview
        - uses: Swatinem/rust-cache@v2
        - uses: taiki-e/install-action@cargo-llvm-cov
        - name: Generate coverage
          run: cargo +nightly-2026-10-17 llvm-cov --all-features --doctests --branch --lcov --output-path lcov.info
        - name: Upload to Codecov
          uses: codecov/codecov-action@v7
          with:
            token: ${{ secrets.CODECOV_TOKEN }}
            files: lcov.info
            fail_ci_if_error: true

    # Undefined-behavior checks of the unsafe code paths (pinned nightly for reproducibility)
    miri:
      name: Miri
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: dtolnay/rust-toolchain@master
          with:
            toolchain: nightly-2026-10-17
            components: miri, rust-src
        - uses: Swatinem/rust-cache@v2
        - run: cargo +nightly-2026-10-17 miri setup
        - name: Miri (Stacked Borrows)
          run: cargo +nightly-2026-10-17 miri test --test miri
        - name: Miri (Tree Borrows)
          run: cargo +nightly-2026-10-17 miri test --test miri
          env:
            MIRIFLAGS: -Zmiri-tree-borrows

    # Security audit
    audit:
      name: Security Audit
      runs-on: ubuntu-latest
      # audit-check reports via a check run and opens issues for new advisories.
      permissions:
        contents: read
        checks: write
        issues: write
      steps:
        - uses: actions/checkout@v7
        - uses: rustsec/audit-check@v2
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

    # Publish to crates.io on version tags
    publish:
      name: Publish
      needs: [fmt, clippy, docs, test, miri, coverage, audit]
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: dtolnay/rust-toolchain@stable
        - uses: Swatinem/rust-cache@v2
        - name: Publish to crates.io
          run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}

    required:
      name: Required
      needs: [fmt, clippy, docs, test, miri, coverage, audit]
      if: always()
      runs-on: ubuntu-latest
      steps:
        - name: Fail if any required job failed
          shell: bash
          run: |
            set -euo pipefail
            echo "fmt=${{ needs.fmt.result }}"
            echo "clippy=${{ needs.clippy.result }}"
            echo "docs=${{ needs.docs.result }}"
            echo "test=${{ needs.test.result }}"
            echo "miri=${{ needs.miri.result }}"
            echo "coverage=${{ needs.coverage.result }}"
            echo "audit=${{ needs.audit.result }}"

            test "${{ needs.fmt.result }}" = "success"
            test "${{ needs.clippy.result }}" = "success"
            test "${{ needs.docs.result }}" = "success"
            test "${{ needs.test.result }}" = "success"
            test "${{ needs.miri.result }}" = "success"
            test "${{ needs.audit.result }}" = "success"

            # coverage can legitimately be "skipped" on fork PRs
            if [ "${{ needs.coverage.result }}" = "failure" ] || [ "${{ needs.coverage.result }}" = "cancelled" ]; then
              exit 1
            fi